<script>
/* 网页预览用的最小 wx 桩：把 wx 的几个接口映射到 DOM，
 * 这样下面直接跑小游戏同一份入口 game.js，核心代码零改动。
 * 注意：widget 版存储走 hatchWidget 状态桥，不碰浏览器存储。
 * v2：指针事件挂在容器上（拖拽经过底部格子时事件不会断），
 * 点在按钮上的事件不转发给游戏。 */
(function () {
  var holder = document.getElementById('game-holder');
  var canvas = document.getElementById('game-canvas');
  var handlers = { start: [], move: [], end: [], cancel: [] };
  function fire(list, e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    var evt = { touches: e.touches, changedTouches: e.changedTouches, clientX: t.clientX, clientY: t.clientY };
    for (var i = 0; i < list.length; i++) list[i](evt);
  }
  function toTouch(e) { return { touches: [{ clientX: e.clientX, clientY: e.clientY }], changedTouches: [{ clientX: e.clientX, clientY: e.clientY }] }; }
  function onButton(e) {
    var t = e.target;
    return !!(t && t.closest && t.closest('button'));
  }
  holder.addEventListener('pointerdown', function (e) { if (onButton(e)) return; e.preventDefault(); fire(handlers.start, toTouch(e)); });
  holder.addEventListener('pointermove', function (e) { if (onButton(e)) return; e.preventDefault(); fire(handlers.move, toTouch(e)); });
  holder.addEventListener('pointerup', function (e) { if (onButton(e)) return; e.preventDefault(); fire(handlers.end, toTouch(e)); });
  holder.addEventListener('pointercancel', function (e) { if (onButton(e)) return; e.preventDefault(); fire(handlers.cancel, toTouch(e)); });
  holder.addEventListener('pointerleave', function (e) { e.preventDefault(); fire(handlers.end, toTouch(e)); });
  holder.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.wx = {
    createCanvas: function () { return canvas; },
    getWindowInfo: function () {
      var w = holder && holder.clientWidth ? holder.clientWidth : window.innerWidth;
      var h = holder && holder.clientHeight ? holder.clientHeight : window.innerHeight;
      return { windowWidth: w, windowHeight: h, pixelRatio: window.devicePixelRatio || 1 };
    },
    onTouchStart: function (cb) { handlers.start.push(cb); },
    onTouchMove: function (cb) { handlers.move.push(cb); },
    onTouchEnd: function (cb) { handlers.end.push(cb); },
    onTouchCancel: function (cb) { handlers.cancel.push(cb); },
    onHide: function (cb) {
      document.addEventListener('visibilitychange', function () { if (document.hidden) cb(); });
    },
    getStorageSync: function (k) {
      try {
        if (typeof window !== 'undefined' && window.hatchWidget) {
          var st = window.hatchWidget.getState({});
          return st ? st[k] : null;
        }
      } catch (e) {}
      return null;
    },
    setStorageSync: function (k, v) {
      try {
        if (typeof window !== 'undefined' && window.hatchWidget) {
          var st = window.hatchWidget.getState({}) || {};
          st[k] = v;
          window.hatchWidget.setState(st);
        }
      } catch (e) {}
    }
  };

  /* require 垫片：让小游戏的 CommonJS 入口在浏览器里也能跑 */
  window.require = function (p) {
    if (p.indexOf('libs/three') >= 0) return window.THREE;
    if (p.indexOf('libs/cannon') >= 0) return window.CANNON;
    if (p.indexOf('platform') >= 0) return window.TeaPlatform;
    if (p.indexOf('items3dv3') >= 0) return window.TEA_ITEMS3DV3;
    if (p.indexOf('levels3dv3') >= 0) return window.TEA_LEVELS3DV3;
    if (p.indexOf('core3dv3') >= 0) return window.TeaGame3DV3;
    if (p.indexOf('items3d') >= 0) return window.TEA_ITEMS3D;
    if (p.indexOf('levels3d') >= 0) return window.TEA_LEVELS3D;
    if (p.indexOf('sound') >= 0) return window.TeaSound;
    if (p.indexOf('core3d') >= 0) return window.TeaGame3D;
    throw new Error('require: 未知模块 ' + p);
  };
})();
</script>

/* 整理小屋 v3 — 游戏核心（Three.js 3D + cannon.js 物理）
 * 相对 v2 的改动：俯视杂物桶相机（仰角约 70°）；两关 = 两天，
 * 第二天 28 件堆满桶；灯光升级（阴影 + sRGB + ACES + 补光）；
 * 桶周围加木质托盘；物品阴影；文案按“天”走；toast 改由 v3 CSS
 * 移到顶部，不再被结算面板盖住。
 * 渲染：Three.js 低多边形可爱风，物品全部程序化搭建，无外部模型。
 * 物理：cannon.js 刚体，物品堆在中央大杂物桶里；拖走一个， pile 会受力重排。
 * 界面：DOM（顶栏 / 分类格 / 结算面板），3D 画布只负责桶和物品。
 * 关键规则（与 v1 相同）：无倒计时、无失败；放错不扣分、弹回桶里；
 * 收完一桶 → 结算星级，下一关。
 * 物品上没有任何文字标签（v2 改动 1），只有底部格子保留文字。
 * 状态：title → intro → playing → clear → （下一关 intro）→ victory
 *
 * 构造函数：new TeaGame3D(canvas, Platform, Items, Levels, Sound, THREE, CANNON)
 * THREE / CANNON 可传可不传（不传则用全局）；node 测试注入桩。
 */
(function (global) {
  'use strict';

  var BUCKET_R = 2.0;      // 桶内半径（物理）
  var BUCKET_H = 2.8;      // 桶壁高（v3 初版 2.3 太浅：28 件自然 pile 顶到 2.86，必然溢出；
                          // 加深到 2.8 后自然 pile 约 90%，仍浅于 v2 的 3.0）
  var WALL_N = 16;         // 桶壁分段数
  var WALL_R = 2.12;       // 桶壁中心半径
var WALL_H_PHYS = 4.6;   // 物理桶壁高（隐形，高出可视桶沿：防止堆满时物品被弹飞出桶；
                          // 拖拽中的物品是运动学刚体，可自由穿过，不影响玩法）
  var FLOOR_Y = 0.3;       // 桶底顶面高度
  var DRAG_MAX_SPEED = 14; // 拖拽时刚体最大速度（单位/秒），太快会把 pile 甩飞

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function TeaGame3D(canvas, Platform, Items, Levels, Sound, THREE, CANNON) {
    this.canvas = canvas || null;
    this.P = Platform || null;
    this.Items = Items;
    this.Levels = Levels;
    this.Sound = Sound;
    this.T = THREE || (typeof global.THREE !== 'undefined' ? global.THREE : null);
    this.C = CANNON || (typeof global.CANNON !== 'undefined' ? global.CANNON : null);

    this.view = { scale: 1, ox: 0, oy: 0, dpr: 1, cssW: 480, cssH: 680 };
    this.state = 'title';
    this.levelIndex = 0;
    this.level = null;
    this.items = [];
    this.boxes = [];   // 分类格矩形（画布 CSS 像素坐标，与 DOM 格子同一组数）
    this.total = 0;
    this.cleared = 0;
    this.score = 0;
    this.levelScore = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.wrongCount = 0;
    this.drag = null;
    this.hoverBox = null;
    this.clearTimer = -1;
    this.stars = 0;
    this.best = 0;
    this.time = 0;
    this.lastTick = 0;
    this.running = false;
    this._bgmStarted = false;
    this._dragTarget = null;
    this._dragPlane = null;
    this._grabOffset = null;
    this._mouth = { x: 240, y: 300, r: 150 }; // 桶口在屏幕上的圆（默认，resize 后重算）
    this._particles = [];
    this._ui = null;      // DOM 句柄
    this._uiCache = {};   // 避免每帧重复写 DOM
    this._raycaster = null;
    this._ndc = null;

    // --- Three.js ---
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.world = null;
    this._bucketGroup = null;

    if (this.P) {
      try { this.best = this.P.storageGet('room_best') || 0; } catch (e) { this.best = 0; }
    }
  }

  // ---------- 尺寸 ----------
  TeaGame3D.prototype._sizeCanvas = function () {
    if (!this.canvas || !this.P) return;
    var s = this.P.getWindowSize();
    var dpr = Math.min(s.pixelRatio || 1, 2);
    this.canvas.width = Math.round(s.width * dpr);
    this.canvas.height = Math.round(s.height * dpr);
    if (this.canvas.style) {
      this.canvas.style.width = s.width + 'px';
      this.canvas.style.height = s.height + 'px';
    }
    this.view.cssW = s.width;
    this.view.cssH = s.height;
    this.view.dpr = dpr;
    if (this.renderer) {
      this.renderer.setPixelRatio(dpr);
      this.renderer.setSize(s.width, s.height, false);
    }
    if (this.camera) {
      this.camera.aspect = s.width / s.height;
      this.camera.updateProjectionMatrix();
    }
    this._layoutBoxes();
    this._updateMouth();
    this._layoutDOM();
  };

  TeaGame3D.prototype.toLogical = function (x, y) {
    // v1 兼容：画布 CSS 像素坐标即逻辑坐标
    return { x: x, y: y };
  };

  // ---------- 3D 场景 ----------
  TeaGame3D.prototype._initGL = function () {
    var T = this.T, C = this.C;
    if (!T || !C || !this.canvas) return false;
    var canvas = this.canvas;
    this.renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true });
    this.renderer.setPixelRatio(Math.min((this.P ? this.P.getWindowSize().pixelRatio : 1) || 1, 2));
    this.renderer.setSize(this.view.cssW, this.view.cssH, false);

    this.scene = new T.Scene();
    this.scene.background = new T.Color('#f5efe3');
    this.camera = new T.PerspectiveCamera(38, this.view.cssW / this.view.cssH, 0.1, 100);
    // v3 俯视：相机移到桶正上方高处，仰角约 70°（略带倾斜以便看清堆叠深度）
    this.camera.position.set(0, 13, 4.6);
    this.camera.lookAt(0, 0.5, 0);

    // v3 灯光升级：柔和阴影 + sRGB + ACES + 暖色补光
    if (this.renderer.shadowMap) {
      this.renderer.shadowMap.enabled = true;
      this.renderer.shadowMap.type = T.PCFSoftShadowMap;
    }
    if (typeof T.sRGBEncoding !== 'undefined') this.renderer.outputEncoding = T.sRGBEncoding;
    if (T.ACESFilmicToneMapping) {
      this.renderer.toneMapping = T.ACESFilmicToneMapping;
      this.renderer.toneMappingExposure = 1.05;
    }
    var hemi = new T.HemisphereLight('#fff8e8', '#8a6d4b', 0.85);
    this.scene.add(hemi);
    var dir = new T.DirectionalLight('#fff6e0', 1.15);
    dir.position.set(5, 10, 7);
    dir.castShadow = true;
    if (dir.shadow) {
      dir.shadow.mapSize.set(1024, 1024);
      dir.shadow.camera.left = -7; dir.shadow.camera.right = 7;
      dir.shadow.camera.top = 7; dir.shadow.camera.bottom = -7;
      dir.shadow.camera.near = 2; dir.shadow.camera.far = 30;
      dir.shadow.bias = -0.0005;
    }
    this.scene.add(dir);
    var fill = new T.DirectionalLight('#ffe9c4', 0.35);
    fill.position.set(-6, 6, -4);
    this.scene.add(fill);

    // 地面
    var ground = new T.Mesh(
      new T.CircleGeometry(9, 40),
      new T.MeshStandardMaterial({ color: '#e8dcc2', roughness: 0.9, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    this.scene.add(ground);
    // v3：桶周围的木质置物托盘（桶就放在托盘中央）
    var tray = new T.Mesh(
      new T.CylinderGeometry(4.1, 4.1, 0.14, 40),
      new T.MeshStandardMaterial({ color: '#c89a68', roughness: 0.8, metalness: 0 })
    );
    tray.position.y = 0.05;
    tray.receiveShadow = true;
    this.scene.add(tray);
    var trayRim = new T.Mesh(
      new T.TorusGeometry(4.08, 0.07, 10, 40),
      new T.MeshStandardMaterial({ color: '#a87a4e', roughness: 0.8, metalness: 0 })
    );
    trayRim.rotation.x = Math.PI / 2;
    trayRim.position.y = 0.12;
    this.scene.add(trayRim);

    this._buildBucket();

    // 物理世界
    var world = new C.World();
    world.gravity.set(0, -9.82, 0);
    world.broadphase = new C.SAPBroadphase(world);
    world.solver.iterations = 12;
    world.allowSleep = true;
    world.defaultContactMaterial.friction = 0.5;
    world.defaultContactMaterial.restitution = 0.05;
    this.world = world;

    // 桶底（静态大方块，顶面 y = 0.3）
    var bottom = new C.Body({
      mass: 0, type: C.Body.STATIC,
      shape: new C.Box(new C.Vec3(BUCKET_R, 0.15, BUCKET_R)),
      position: new C.Vec3(0, 0.15, 0)
    });
    world.addBody(bottom);
    // 桶壁：16 段静态方块围成一圈
    for (var i = 0; i < WALL_N; i++) {
      var th = (i / WALL_N) * Math.PI * 2;
      var wb = new C.Body({
        mass: 0, type: C.Body.STATIC,
        shape: new C.Box(new C.Vec3(0.55, WALL_H_PHYS / 2, 0.14)),
        position: new C.Vec3(Math.cos(th) * WALL_R, WALL_H_PHYS / 2, Math.sin(th) * WALL_R)
      });
      wb.quaternion.setFromEuler(0, -th - Math.PI / 2, 0);
      world.addBody(wb);
    }
    // 安全网地面（桶外掉落也不会穿底）
    var floor = new C.Body({
      mass: 0, type: C.Body.STATIC,
      shape: new C.Plane(),
      position: new C.Vec3(0, 0, 0)
    });
    floor.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    floor.position.set(0, 0.12, 0); // v3：托盘顶面高度，掉出桶的物品落在托盘上
    world.addBody(floor);

    this._raycaster = new T.Raycaster();
    this._ndc = new T.Vector2();
    this._dragPlane = new T.Plane();
    this._grabOffset = new T.Vector3();
    return true;
  };

  TeaGame3D.prototype._buildBucket = function () {
    var T = this.T;
    var g = new T.Group();
    // 桶身（开口圆台，双面）
    var shell = new T.Mesh(
      new T.CylinderGeometry(2.2, 2.05, BUCKET_H, 32, 1, true),
      new T.MeshStandardMaterial({ color: '#b98a5a', roughness: 0.75, metalness: 0, side: T.DoubleSide })
    );
    shell.castShadow = true;
    shell.receiveShadow = true;
    shell.position.y = BUCKET_H / 2;
    g.add(shell);
    // 竹编竖条（视觉）
    for (var i = 0; i < WALL_N; i++) {
      var th = (i / WALL_N) * Math.PI * 2;
      var slat = new T.Mesh(
        new T.BoxGeometry(0.5, BUCKET_H - 0.1, 0.08),
        new T.MeshStandardMaterial({ color: (i % 2 === 0) ? '#c89a68' : '#a87a4e', roughness: 0.8, metalness: 0 })
      );
      slat.castShadow = true;
      slat.position.set(Math.cos(th) * 2.52, BUCKET_H / 2, Math.sin(th) * 2.52);
      slat.rotation.y = -th - Math.PI / 2;
      g.add(slat);
    }
    // 桶底（视觉）
    var bottom = new T.Mesh(
      new T.CylinderGeometry(2.1, 2.1, 0.25, 32),
      new T.MeshStandardMaterial({ color: '#8a6136', roughness: 0.8, metalness: 0 })
    );
    bottom.receiveShadow = true;
    bottom.position.y = 0.12;
    g.add(bottom);
    var inner = new T.Mesh(
      new T.CylinderGeometry(BUCKET_R, BUCKET_R, 0.06, 32),
      new T.MeshStandardMaterial({ color: '#7a5230', roughness: 0.85, metalness: 0 })
    );
    inner.receiveShadow = true;
    inner.position.y = 0.26;
    g.add(inner);
    // 桶口沿
    var rim = new T.Mesh(
      new T.TorusGeometry(2.18, 0.11, 12, 40),
      new T.MeshStandardMaterial({ color: '#8a6136', roughness: 0.7, metalness: 0 })
    );
    rim.castShadow = true;
    rim.rotation.x = Math.PI / 2;
    rim.position.y = BUCKET_H;
    g.add(rim);
    this.scene.add(g);
    this._bucketGroup = g;
  };

  // ---------- 关卡 ----------
  TeaGame3D.prototype.loadLevel = function (idx, seed) {
    var defs = this.Levels.LEVELS;
    idx = clamp(idx, 0, defs.length - 1);
    this.levelIndex = idx;
    this.level = defs[idx];
    var rng = mulberry32(typeof seed === 'number' ? seed : (idx * 7919 + 13));

    // 先清掉上一关的 3D 物品
    this._clearItems();

    // 分类格：关卡分类 + 有冒牌货时加“杂物”格
    var catKeys = this.level.cats.slice();
    if (this.level.decoys > 0) catKeys.push('other');
    this._layoutBoxes(catKeys);

    // 按分类均分物品数
    var counts = [];
    var base = Math.floor(this.level.items / this.level.cats.length);
    var rem = this.level.items % this.level.cats.length;
    for (var i = 0; i < this.level.cats.length; i++) {
      counts.push(base + (i < rem ? 1 : 0));
    }

    var types = [];
    for (var c = 0; c < this.level.cats.length; c++) {
      var pool = this.Items.typesOfCat(this.level.cats[c]).slice();
      for (var s = pool.length - 1; s > 0; s--) {
        var j = Math.floor(rng() * (s + 1));
        var tmp = pool[s]; pool[s] = pool[j]; pool[j] = tmp;
      }
      for (var k = 0; k < counts[c]; k++) {
        types.push(pool[k % pool.length]);
      }
    }
    // 冒牌货
    var decoyPool = this.Items.typesOfCat('other').slice();
    for (var d = decoyPool.length - 1; d > 0; d--) {
      var j2 = Math.floor(rng() * (d + 1));
      var tmp2 = decoyPool[d]; decoyPool[d] = decoyPool[j2]; decoyPool[j2] = tmp2;
    }
    for (var m = 0; m < this.level.decoys; m++) {
      types.push(decoyPool[m % decoyPool.length]);
    }
    // 整体打乱
    for (var q = types.length - 1; q > 0; q--) {
      var j3 = Math.floor(rng() * (q + 1));
      var tmp3 = types[q]; types[q] = types[j3]; types[j3] = tmp3;
    }

    // v3：逐件倒进桶里（见 update / _spawnNext）：上一件落稳后才落下一件，
    // 从 pile 顶上方 0.3 米、随机半径 ≤1.5 处落下，落在斜坡上滚进缝里。
    // 预排堆位已废弃：计划位置≠沉降后的实际位置（物品落地会倾倒移位），
    // 后生成的物品按计划位置检查通过、按实际位置却重叠，会被求解器弹飞出桶。
    this.items = [];
    this._levelRng = rng;
    this._spawnQueue = types;
    this._spawnTimer = 0;
    this._spawnWait = 0;
    this._lastSpawned = null;

    this.total = types.length;
    this.cleared = 0;
    this.levelScore = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.wrongCount = 0;
    this.drag = null;
    this.hoverBox = null;
    this.clearTimer = -1;
    this.stars = 0;
    this.time = 0;
    this._particles = [];
    this._layoutDOM(); // 格子换了，DOM 格子跟着重建
    this._syncDOM(true);
  };

  // v3：倒下一件——从当前 pile 顶上方 0.3 米、随机半径 ≤1.5 处落下。
  // 半径放开到 1.5：物品落在斜坡上滚进缝里，pile 更扁平（只落中心会
  // 在峰顶越叠越高）；落差只 0.3 米，冲击能量小，pile 不会被砸散。
  TeaGame3D.prototype._spawnNext = function () {
    if (!this._spawnQueue || this._spawnQueue.length === 0) return false;
    var type = this._spawnQueue.shift();
    var rng = this._levelRng || Math.random;
    var top = FLOOR_Y;
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      var half = 0.3;
      if (it.type && it.type.shape) {
        if (it.type.shape.kind === 'sphere') half = it.type.shape.r;
        else half = Math.max(it.type.shape.hx, it.type.shape.hy, it.type.shape.hz);
      }
      if (it.y + half > top) top = it.y + half;
    }
    var a = rng() * Math.PI * 2;
    var rr = rng() * 1.5;
    var y = top + 0.3;
    this._lastSpawned = this._spawnItem(type, Math.cos(a) * rr, y, Math.sin(a) * rr, rng() * Math.PI * 2);
    return true;
  };

  TeaGame3D.prototype._spawnItem = function (type, x, y, z, rotY) {
    var T = this.T, C = this.C;
    var mesh = null;
    if (T && type.build) {
      mesh = type.build(T);
      mesh.userData.itemKey = type.key;
      mesh.traverse(function (o) { if (o.isMesh) { o.castShadow = true; } });
    }
    var body = null;
    if (C) {
      var shape = this._makeShape(type.shape);
      body = new C.Body({
        mass: 1,
        shape: shape,
        position: new C.Vec3(x, y, z)
      });
      body.quaternion.setFromEuler(0, rotY || 0, 0);
      body.linearDamping = 0.35;
      body.angularDamping = 0.5;
      body.allowSleep = true;
      body.sleepSpeedLimit = 0.5;
      body.sleepTimeLimit = 0.4;
      if (this.world) this.world.addBody(body);
    }
    if (this.scene && mesh) this.scene.add(mesh);
    var it = {
      type: type, mesh: mesh, body: body,
      x: x, y: y, z: z, homeX: x, homeY: y, homeZ: z,
      state: 'falling', t: 0, scale: 1,
      fromX: x, fromY: y, fromZ: z, toX: x, toY: y, toZ: z,
      restFrames: 0
    };
    if (mesh) mesh.userData.item = it;
    this.items.push(it);
    return it;
  };

  TeaGame3D.prototype._makeShape = function (spec) {
    var C = this.C;
    if (!spec) return new C.Box(new C.Vec3(0.5, 0.5, 0.5));
    if (spec.kind === 'sphere') return new C.Sphere(spec.r);
    return new C.Box(new C.Vec3(spec.hx, spec.hy, spec.hz));
  };

  TeaGame3D.prototype._clearItems = function () {
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      if (it.body && this.world) {
        try { this.world.removeBody(it.body); } catch (e) {}
      }
      if (it.mesh && this.scene) this.scene.remove(it.mesh);
    }
    this.items = [];
    for (var j = 0; j < this._particles.length; j++) {
      this.scene.remove(this._particles[j].points);
    }
    this._particles = [];
  };

  // ---------- 分类格布局（画布 CSS 像素，与 DOM 格子同一组数） ----------
  TeaGame3D.prototype._layoutBoxes = function (catKeys) {
    var keys = catKeys || (this.level ? this._catKeysOfLevel() : []);
    var W = this.view.cssW, H = this.view.cssH;
    var n = keys.length;
    if (n === 0) { this.boxes = []; return; }
    var rows = n <= 3 ? 1 : 2;
    var perRow = Math.ceil(n / rows);
    var gap = 10, marginX = 12;
    var bw = (W - marginX * 2 - (perRow - 1) * gap) / perRow;
    // v3-fix（窄屏排版）：格子改纵向排布（图标上、分类名中、计数下），两行高 80。
    // 旧 64 高的横向格子在 360px 宽时文字列只剩约 30px，分类名（.u242-ch 自带
    // 左右各 12px 内边距 + 19px 字）溢出格外、"还剩 N 件"逐字换行撑出格底。
    // 纵向后内容高 = 边框 6 + 内边距 10 + 图标 28 + 间距 2 + 名 17.5 + 计数 14.3 ≈ 78 ≤ 80。
    var bh = rows === 1 ? 118 : 80;
    var y0 = H - 12 - rows * bh - (rows - 1) * gap;
    var boxes = [];
    for (var i = 0; i < n; i++) {
      var row = Math.floor(i / perRow);
      var col = i % perRow;
      var inRow = Math.min(perRow, n - row * perRow);
      var rowW = inRow * bw + (inRow - 1) * gap;
      var x = (W - rowW) / 2 + col * (bw + gap);
      var y = y0 + row * (bh + gap);
      var cat = this.Items.catByKey(keys[i]);
      boxes.push({
        cat: cat, x: x, y: y, w: bw, h: bh,
        cx: x + bw / 2, cy: y + bh / 2, shake: 0
      });
    }
    this.boxes = boxes;
  };

  TeaGame3D.prototype._catKeysOfLevel = function () {
    var keys = this.level.cats.slice();
    if (this.level.decoys > 0) keys.push('other');
    return keys;
  };

  // 桶口在屏幕上的圆（用于“松手在桶口上方 → 直接放回桶里”判定）
  TeaGame3D.prototype._updateMouth = function () {
    try {
      if (!this.camera || !this.T) return;
      var T = this.T;
      var c = new T.Vector3(0, BUCKET_H + 0.1, 0).project(this.camera);
      var e = new T.Vector3(BUCKET_R, BUCKET_H + 0.1, 0).project(this.camera);
      var cx = (c.x + 1) / 2 * this.view.cssW;
      var cy = (-c.y + 1) / 2 * this.view.cssH;
      var ex = (e.x + 1) / 2 * this.view.cssW;
      this._mouth = { x: cx, y: cy, r: Math.max(90, Math.abs(ex - cx) * 1.25) };
    } catch (err) {
      this._mouth = { x: this.view.cssW / 2, y: 300, r: 150 };
    }
  };

  // ---------- 流程 ----------
  TeaGame3D.prototype.startGame = function () {
    this.score = 0;
    this.loadLevel(0, Date.now() % 100000);
    this.state = 'intro';
    this._syncDOM(true);
  };

  TeaGame3D.prototype.startLevel = function () {
    this.state = 'playing';
    this._syncDOM(true);
  };

  TeaGame3D.prototype.nextLevel = function () {
    if (this.levelIndex + 1 >= this.Levels.LEVELS.length) {
      this.state = 'victory';
      if (this.score > this.best) {
        this.best = this.score;
        if (this.P) { try { this.P.storageSet('room_best', this.best); } catch (e) {} }
      }
      // Lucian #435：胜利 toast
      if (this._lucian && this._lucian.toast) {
        this._lucian.toast.showToast('小屋焕然一新！总分 ' + this.score + ' 分');
      }
    } else {
      this.loadLevel(this.levelIndex + 1, Date.now() % 100000);
      this.state = 'intro';
    }
    this._syncDOM(true);
  };

  // ---------- 输入 ----------
  TeaGame3D.prototype._ndcFromScreen = function (sx, sy) {
    var nx = (sx / this.view.cssW) * 2 - 1;
    var ny = -(sy / this.view.cssH) * 2 + 1;
    return { x: nx, y: ny };
  };

  TeaGame3D.prototype._pickMeshes = function () {
    var out = [];
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      if ((it.state === 'table' || it.state === 'falling') && it.mesh) out.push(it.mesh);
    }
    return out;
  };

  TeaGame3D.prototype.pickAt = function (sx, sy) {
    if (this.state !== 'playing') return null;
    if (!this._raycaster || !this.camera) return null;
    // 先刷新矩阵世界：渲染节流时 mesh 矩阵会停在旧位置，射线按旧矩阵检测会打偏
    if (this.scene && this.scene.updateMatrixWorld) this.scene.updateMatrixWorld(true);
    var ndc = this._ndcFromScreen(sx, sy);
    this._ndc.set(ndc.x, ndc.y);
    this._raycaster.setFromCamera(this._ndc, this.camera);
    var hits = this._raycaster.intersectObjects(this._pickMeshes(), true);
    for (var i = 0; i < hits.length; i++) {
      var o = hits[i].object;
      var it = null;
      while (o) {
        if (o.userData && o.userData.item) { it = o.userData.item; break; }
        o = o.parent;
      }
      if (it && (it.state === 'table' || it.state === 'falling')) {
        return this._grab(it, hits[i].point);
      }
    }
    // 没射中 mesh 时的宽容处理：抓屏幕上离点按位置最近的可拖物品（40px 内）。
    // 细长物品（勺柄、铅笔）在手机上本来就难精确点中，点到附近也算点中。
    var best2 = null, bestD = 40;
    for (var j = 0; j < this.items.length; j++) {
      var it2 = this.items[j];
      if (it2.state !== 'table' && it2.state !== 'falling') continue;
      var p2 = this._toScreen(it2.x, it2.y, it2.z);
      var d = Math.sqrt((p2.x - sx) * (p2.x - sx) + (p2.y - sy) * (p2.y - sy));
      if (d < bestD) { bestD = d; best2 = it2; }
    }
    if (best2) return this._grab(best2, { x: best2.x, y: best2.y, z: best2.z });
    return null;
  };

  // 测试用：不经过射线，直接抓起某个物品
  TeaGame3D.prototype.pickItem = function (it) {
    if (this.state !== 'playing') return null;
    if (!it || (it.state !== 'table' && it.state !== 'falling')) return null;
    var p = it.body ? { x: it.body.position.x, y: it.body.position.y, z: it.body.position.z }
      : { x: it.x, y: it.y, z: it.z };
    return this._grab(it, p);
  };

  TeaGame3D.prototype._grab = function (it, hitPoint) {
    it.state = 'dragging';
    it.scale = 1.12;
    if (it.mesh) it.mesh.scale.set(1.12, 1.12, 1.12);
    this.drag = it;
    if (it.body && this.C) {
      it.body.type = this.C.Body.KINEMATIC;
      it.body.velocity.set(0, 0, 0);
      it.body.angularVelocity.set(0, 0, 0);
      it.body.wakeUp();
    }
    // 拖拽平面：过抓取点、法向朝向相机
    if (this.camera && this._dragPlane && this.T) {
      var dir = new this.T.Vector3();
      this.camera.getWorldDirection(dir);
      var pt = new this.T.Vector3(hitPoint.x, hitPoint.y, hitPoint.z);
      this._dragPlane.setFromNormalAndCoplanarPoint(dir, pt);
      var bp = it.body ? it.body.position : { x: it.x, y: it.y, z: it.z };
      this._grabOffset.set(pt.x - bp.x, pt.y - bp.y, pt.z - bp.z);
    }
    this._dragTarget = null;
    if (this.Sound) this.Sound.pickup();
    return it;
  };

  TeaGame3D.prototype.dragTo = function (sx, sy) {
    if (!this.drag) return;
    var it = this.drag;
    if (this._raycaster && this.camera && this._dragPlane && this.T) {
      var ndc = this._ndcFromScreen(sx, sy);
      this._ndc.set(ndc.x, ndc.y);
      this._raycaster.setFromCamera(this._ndc, this.camera);
      var target = new this.T.Vector3();
      var hit = this._raycaster.ray.intersectPlane(this._dragPlane, target);
      if (hit) {
        var tx = clamp(target.x - this._grabOffset.x, -6, 6);
        var ty = clamp(target.y - this._grabOffset.y, 0.6, 9);
        var tz = clamp(target.z - this._grabOffset.z, -4, 6);
        this._dragTarget = { x: tx, y: ty, z: tz };
      }
    }
    // 无 3D 时（node 测试）用屏幕坐标近似：只更新悬停格子
    this.hoverBox = this._hitBox(sx, sy);
    this._syncDOM();
  };

  TeaGame3D.prototype.dropAt = function (sx, sy) {
    if (!this.drag) return null;
    var it = this.drag;
    this.drag = null;
    this.hoverBox = null;
    var box = this._hitBox(sx, sy);
    if (!box) {
      if (this._inBucketMouth(sx, sy)) {
        // 松手在桶口上方：直接放回桶里
        this._releaseIntoBucket(it);
        return 'bucket';
      }
      // 落在空地：弹回桶里，不扣分
      this._sendBackToBucket(it, false, null);
      return 'none';
    }
    if (box.cat.key === it.type.cat) {
      return this._collect(it, box);
    }
    // 放错格：弹回桶里，不扣分
    this._sendBackToBucket(it, true, box);
    return 'wrong';
  };

  TeaGame3D.prototype._hitBox = function (x, y) {
    for (var i = 0; i < this.boxes.length; i++) {
      var b = this.boxes[i];
      if (x >= b.x - 8 && x <= b.x + b.w + 8 && y >= b.y - 8 && y <= b.y + b.h + 8) return b;
    }
    return null;
  };

  TeaGame3D.prototype._inBucketMouth = function (sx, sy) {
    var m = this._mouth;
    var dx = sx - m.x, dy = sy - m.y;
    return dx * dx + dy * dy <= m.r * m.r;
  };

  TeaGame3D.prototype._releaseIntoBucket = function (it) {
    it.state = 'falling';
    it.restFrames = 0;
    if (it.body && this.C) {
      it.body.type = this.C.Body.DYNAMIC;
      it.body.velocity.set(0, 0, 0);
      it.body.angularVelocity.set(0, 0, 0);
      it.body.wakeUp();
    }
    if (it.mesh) it.mesh.scale.set(1, 1, 1);
    it.scale = 1;
  };

  TeaGame3D.prototype._sendBackToBucket = function (it, wrong, box) {
    if (wrong) {
      this.combo = 0;
      this.wrongCount++;
      if (box) box.shake = 0.35;
      if (this.Sound) this.Sound.wrong();
    }
    it.state = 'returning';
    it.t = 0;
    var bp = it.body ? it.body.position : { x: it.x, y: it.y, z: it.z };
    it.fromX = bp.x; it.fromY = bp.y; it.fromZ = bp.z;
    it.toX = (Math.random() - 0.5) * 1.4;
    it.toY = 5.4;
    it.toZ = (Math.random() - 0.5) * 1.4;
  };

  TeaGame3D.prototype._collect = function (it, box) {
    this.combo++;
    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
    var gained = 100 + (this.combo - 1) * 20;
    this.score += gained;
    this.levelScore += gained;
    it.state = 'flying';
    it.t = 0;
    if (it.body && this.world) {
      // 刚体移出世界，pile 会自然塌下一点（拖走一个，其他的会动）
      try { this.world.removeBody(it.body); } catch (e) {}
      it.body = null;
    }
    this._burst(it.x, it.y + 0.5, it.z, box.cat.color);
    this._floater(box.cx, box.cy - box.h / 2 - 6, '+' + gained, box.cat.color);
    // Lucian #372：一个“+1”从格子飞向进度条
    if (this._lucian && this._lucian.xp && box.el) this._lucian.xp.fly(box.el);
    if (this.combo >= 2) {
      this._floater(box.cx, box.cy - box.h / 2 - 34, '连对 x' + this.combo + '！', '#c06b3a');
    }
    if (this.Sound) this.Sound.correct();
    this._syncDOM();
    return 'correct';
  };

  TeaGame3D.prototype._burst = function (x, y, z, color) {
    if (!this.T || !this.scene) return;
    var T = this.T;
    var n = 14;
    var pos = new Float32Array(n * 3);
    var vel = [];
    for (var i = 0; i < n; i++) {
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      var a = Math.random() * Math.PI * 2;
      var b = Math.random() * Math.PI - Math.PI / 2;
      var sp = 1.5 + Math.random() * 2.5;
      vel.push({
        x: Math.cos(a) * Math.cos(b) * sp,
        y: Math.abs(Math.sin(b)) * sp + 1.2,
        z: Math.sin(a) * Math.cos(b) * sp
      });
    }
    var geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    var mat = new T.PointsMaterial({ color: color || '#f4a900', size: 0.18, transparent: true });
    var points = new T.Points(geo, mat);
    this.scene.add(points);
    this._particles.push({ points: points, vel: vel, life: 0.6, maxLife: 0.6 });
  };

  TeaGame3D.prototype._floater = function (x, y, text, color) {
    // DOM 飘字（无 DOM 时跳过）
    if (!this._ui || !this._ui.floaters) return;
    var doc = this._ui.floaters.ownerDocument;
    var el = doc.createElement('div');
    el.className = 't3d-floater';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color || '#7a5230';
    this._ui.floaters.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1100);
  };

  // ---------- 更新 ----------
  TeaGame3D.prototype.update = function (dt) {
    if (dt > 0.05) dt = 0.05;
    if (this.state === 'playing') this.time += dt;

    // v3：逐件倒桶（标题 / 介绍 / 游玩时都继续落，标题屏后也能看到桶里有东西）：
    // 上一件落稳（速度 < 1）后才落下一件；超过 1.5 秒还没落稳则强制落下一件，
    // 防止某件在斜坡上一直慢滚导致后续全卡住。
    if (this._spawnQueue && this._spawnQueue.length > 0 &&
        (this.state === 'title' || this.state === 'intro' || this.state === 'playing')) {
      this._spawnTimer -= dt;
      this._spawnWait += dt;
      var last = this._lastSpawned;
      var settled = !last || !last.body || last.body.velocity.norm() < 1.0;
      if (this._spawnTimer <= 0 && (settled || this._spawnWait > 1.5)) {
        this._spawnTimer = 0.25;
        this._spawnWait = 0;
        this._spawnNext();
      }
    }

    // 物理步进（固定 1/60，节流 3 子步）
    if (this.world) {
      try { this.world.step(1 / 60, dt, 3); } catch (e) {}
    }

    // 拖拽中的刚体：匀速追向目标点（带速度，pile 会被轻轻推开）
    if (this.drag && this._dragTarget && this.drag.body) {
      var b = this.drag.body;
      var dx = this._dragTarget.x - b.position.x;
      var dy = this._dragTarget.y - b.position.y;
      var dz = this._dragTarget.z - b.position.z;
      var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (dist > 0.01) {
        var step = Math.min(dist, DRAG_MAX_SPEED * dt);
        var vx = dx / dist * step / Math.max(dt, 0.001);
        var vy = dy / dist * step / Math.max(dt, 0.001);
        var vz = dz / dist * step / Math.max(dt, 0.001);
        b.position.x += dx / dist * step;
        b.position.y += dy / dist * step;
        b.position.z += dz / dist * step;
        b.velocity.set(vx, vy, vz);
      } else {
        b.velocity.set(0, 0, 0);
      }
    }

    // 同步 mesh ← body，并处理状态机
    for (var k = this.items.length - 1; k >= 0; k--) {
      var it = this.items[k];
      if (it.body && it.mesh) {
        it.mesh.position.copy(it.body.position);
        it.mesh.quaternion.copy(it.body.quaternion);
        it.x = it.body.position.x; it.y = it.body.position.y; it.z = it.body.position.z;
      }
      if (it.state === 'falling' && it.body) {
        var sp = it.body.velocity.norm ? it.body.velocity.norm() : 0;
        var asp = it.body.angularVelocity && it.body.angularVelocity.norm ? it.body.angularVelocity.norm() : 0;
        if (sp < 0.3 && asp < 0.3) {
          it.restFrames++;
          if (it.restFrames > 12) it.state = 'table';
        } else {
          it.restFrames = 0;
        }
      } else if (it.state === 'flying') {
        it.t += dt / 0.22;
        var t = Math.min(1, it.t);
        var sc = 1.12 * (1 - t);
        if (it.mesh) {
          it.mesh.scale.set(Math.max(0.01, sc), Math.max(0.01, sc), Math.max(0.01, sc));
          it.mesh.position.y += dt * 2;
        }
        if (t >= 1) {
          if (it.mesh && this.scene) this.scene.remove(it.mesh);
          this.items.splice(k, 1);
          this.cleared++;
          if (this.cleared >= this.total && this.clearTimer < 0) {
            this.clearTimer = 0.6;
          }
        }
      } else if (it.state === 'returning') {
        it.t += dt / 0.35;
        var t2 = Math.min(1, it.t);
        var e2 = 1 - Math.pow(1 - t2, 3);
        var nx = it.fromX + (it.toX - it.fromX) * e2;
        var ny = it.fromY + (it.toY - it.fromY) * e2;
        var nz = it.fromZ + (it.toZ - it.fromZ) * e2;
        if (it.body) {
          it.body.position.set(nx, ny, nz);
          it.body.velocity.set(0, 0, 0);
        }
        if (it.mesh) it.mesh.position.set(nx, ny, nz);
        it.x = nx; it.y = ny; it.z = nz;
        if (t2 >= 1) {
          it.state = 'falling';
          it.restFrames = 0;
          if (it.mesh) it.mesh.scale.set(1, 1, 1);
          it.scale = 1;
          if (it.body && this.C) {
            it.body.type = this.C.Body.DYNAMIC;
            it.body.velocity.set(0, 0, 0);
            it.body.wakeUp();
          }
        }
      }
    }

    // 粒子
    for (var p = this._particles.length - 1; p >= 0; p--) {
      var pt = this._particles[p];
      pt.life -= dt;
      if (pt.life <= 0) {
        if (this.scene) this.scene.remove(pt.points);
        if (pt.points.geometry && pt.points.geometry.dispose) pt.points.geometry.dispose();
        if (pt.points.material && pt.points.material.dispose) pt.points.material.dispose();
        this._particles.splice(p, 1);
        continue;
      }
      var attr = pt.points.geometry.attributes.position;
      for (var q = 0; q < pt.vel.length; q++) {
        pt.vel[q].y -= 7 * dt;
        attr.array[q * 3] += pt.vel[q].x * dt;
        attr.array[q * 3 + 1] += pt.vel[q].y * dt;
        attr.array[q * 3 + 2] += pt.vel[q].z * dt;
      }
      attr.needsUpdate = true;
      pt.points.material.opacity = pt.life / pt.maxLife;
    }

    // 格子晃动
    for (var bi = 0; bi < this.boxes.length; bi++) {
      if (this.boxes[bi].shake > 0) this.boxes[bi].shake -= dt;
    }

    if (this.clearTimer > 0) {
      this.clearTimer -= dt;
      if (this.clearTimer <= 0) {
        this.clearTimer = -1;
        this._finishLevel();
      }
    }
    this._syncDOM();
  };

  TeaGame3D.prototype._finishLevel = function () {
    this.stars = this.wrongCount === 0 ? 3 : (this.wrongCount <= 2 ? 2 : 1);
    var bonus = this.wrongCount === 0 ? 200 : (this.wrongCount <= 2 ? 100 : 0);
    this.levelScore += bonus;
    this.score += bonus;
    this.state = 'clear';
    if (this.Sound) this.Sound.clear();
    // Lucian #372：进度条满格闪光 + “过关！”横幅
    if (this._lucian && this._lucian.xp) this._lucian.xp.levelUp();
    // Lucian #435：过关 toast（带“下一关”快捷操作）
    if (this._lucian && this._lucian.toast) {
      var self = this;
      var last = this.levelIndex + 1 >= this.Levels.LEVELS.length;
      this._lucian.toast.showToast(
        this.level.name + '整理完成！' + this.stars + '星',
        last ? '查看成绩' : '第二天',
        function () { if (self.state === 'clear') self.nextLevel(); });
    }
    this._syncDOM(true);
  };

  // ---------- 输入绑定 ----------
  TeaGame3D.prototype._onInput = function (e) {
    var p = this.toLogical(e.x, e.y);
    if (e.type === 'down') {
      if (this.Sound && !this._bgmStarted) {
        this._bgmStarted = true;
        this.Sound.ensureBGM();
      }
      if (this.state === 'playing') this.pickAt(p.x, p.y);
    } else if (e.type === 'move') {
      if (this.state === 'playing') this.dragTo(p.x, p.y);
    } else if (e.type === 'up') {
      if (this.state === 'playing') this.dropAt(p.x, p.y);
    }
  };

  TeaGame3D.prototype.boot = function () {
    if (!this.canvas || !this.P) return;
    var self = this;
    this._sizeCanvas();
    this._initGL();
    this._sizeCanvas(); // 相机就绪后重算桶口位置
    this._buildDOM();
    this.loadLevel(0);
    this.state = 'title';
    this.P.bindTouch(this.canvas, function (e) { self._onInput(e); });
    this.P.onHide(function () { if (self.Sound) self.Sound.suspend(); });
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('resize', function () { self._sizeCanvas(); });
    }
    this.running = true;
    this.lastTick = Date.now();
    var loop = function () {
      if (!self.running) return;
      var now = Date.now();
      var dt = (now - self.lastTick) / 1000;
      self.lastTick = now;
      self.update(dt);
      self.render();
      self.P.raf(loop);
    };
    loop();
    this._syncDOM(true);
  };

  TeaGame3D.prototype.render = function () {
    if (this.renderer && this.scene && this.camera) {
      this.renderer.render(this.scene, this.camera);
    }
  };

  // ---------- DOM 界面（顶栏 / 格子 / 结算面板；无 DOM 时跳过） ----------
  TeaGame3D.prototype._buildDOM = function () {
    if (typeof document === 'undefined') return;
    var holder = this.canvas.parentElement;
    if (!holder) return;
    var doc = document;
    var self = this;

    var css = [
      '.t3d-ui{position:absolute;inset:0;pointer-events:none;font-family:"Quicksand","FreeSans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;overflow:hidden}',
      '.t3d-hud{position:absolute;top:0;left:0;right:0;padding:10px 14px 0;display:flex;align-items:center;gap:8px}',
      '.t3d-title{font-size:20px;font-weight:bold;color:#4A403A}',
      '.t3d-level{flex:1;text-align:center;font-size:14px;color:#8A6D4B}',
      '.t3d-score{font-size:16px;font-weight:bold;color:#4A403A}',
      '.t3d-mute{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:2px solid #D4B896;background:#fff8ea;color:#8a6d4b;font-size:18px;cursor:pointer}',
      '.t3d-bin{position:absolute;pointer-events:none;border-radius:14px;background:#fff8ea;border:3px solid #888;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 4px;text-align:center;overflow:hidden;box-sizing:border-box;box-shadow:inset 0 3px 0 rgba(74,64,58,.07),0 2px 0 rgba(74,64,58,.12);transition:background .12s,border-width .12s}',
      '.t3d-bin.hot{background:var(--bin-light,#f0e9d8);border-width:5px}',
      '.t3d-bin.shake{animation:t3dshake .3s}',
      '@keyframes t3dshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}',
      '.t3d-bin-icon{position:relative;z-index:1;flex:none;width:28px;height:28px}',
      '.t3d-bin-icon svg{width:28px;height:28px}',
      /* v3-fix：分类名必须在格内。Lucian .u242-ch 自带 padding:0 12px + height:30px + line-height:30px，
         在窄屏格子里会把名字顶出格外；这里用更高特异度的选择器把它清掉，名字改 14px 单行居中。

  // ---------- Lucian UX/UI 移植层初始化（#002 按钮 / #372 进度条 / #435 toast / #242 chip） ----------
  TeaGame3D.prototype._initLucian = function () {
    this._lucian = { xp: null, toast: null, chips: null };
    var L = (typeof global !== 'undefined' && global.LucianUI) || null;
    if (!L || !this._ui) return;
    var u = this._ui;
    var btns = u.root.querySelectorAll('.u002');
    for (var i = 0; i < btns.length; i++) L.initButton(btns[i]);
    if (u.xpRoot) this._lucian.xp = L.initXP(u.xpRoot, u.root);
    if (u.toastRoot) this._lucian.toast = L.initToast(u.toastRoot);
    if (u.chipPill) this._lucian.chips = L.initChips(u.root, u.chipPill);
    if (this._lucian.xp) this._lucian.xp.reset(this.levelIndex + 1, this.total);
  };

  TeaGame3D.prototype._layoutDOM = function () {
    if (!this._ui) return;
    // 格子 DOM 与 _layoutBoxes 的矩形一一对应
    var binsEl = this._ui.bins;
    while (binsEl.firstChild) binsEl.removeChild(binsEl.firstChild);
    for (var i = 0; i < this.boxes.length; i++) {
      var b = this.boxes[i];
      var el = document.createElement('div');
      el.className = 't3d-bin';
      el.setAttribute('data-cat', b.cat.key);
      el.style.left = b.x + 'px';
      el.style.top = b.y + 'px';
      el.style.width = b.w + 'px';
      el.style.height = b.h + 'px';
      el.style.borderColor = b.cat.color;
      el.style.setProperty('--bin-light', b.cat.light);
      el.innerHTML =
        '<div class="t3d-bin-icon">' + binIconSVG(b.cat.key) + '</div>' +
        '<div class="t3d-bin-name u242-ch" style="color:' + b.cat.color + '" aria-current="false">' + b.cat.name + '</div>' +
        '<div class="t3d-bin-count"></div>';
      binsEl.appendChild(el);
      b.el = el;
    }
  };

  function binIconSVG(cat) {
    if (cat === 'clothes') {
      return '<svg viewBox="0 0 40 40"><path d="M14 6 L6 9 L4 16 L9 18 L11 15 L11 34 L29 34 L29 15 L31 18 L36 16 L34 9 L26 6 Q20 12 14 6 Z" fill="#c06b3a"/></svg>';
    }
    if (cat === 'tableware') {
      return '<svg viewBox="0 0 40 40"><path d="M10 12 h18 v12 a9 9 0 0 1 -18 0 Z" fill="#4e8a8a"/><path d="M28 15 q7 0 7 5 q0 5 -7 5" fill="none" stroke="#4e8a8a" stroke-width="3"/></svg>';
    }
    if (cat === 'digital') {
      return '<svg viewBox="0 0 40 40"><rect x="12" y="5" width="16" height="30" rx="3" fill="#2b2d42"/><rect x="15" y="9" width="10" height="18" rx="1" fill="#7fb3d5"/><rect x="17" y="30" width="6" height="2" rx="1" fill="#f0ead8"/></svg>';
    }
    if (cat === 'stationery') {
      return '<svg viewBox="0 0 40 40"><g transform="rotate(35 20 20)"><rect x="17" y="4" width="6" height="24" fill="#e8b93a"/><path d="M17 28 L23 28 L20 36 Z" fill="#e8cfa8"/><rect x="17" y="2" width="6" height="3" fill="#d94a4a"/></g></svg>';
    }
    return '<svg viewBox="0 0 40 40"><rect x="7" y="12" width="26" height="20" rx="2" fill="#b09a7a"/><path d="M7 12 L20 20 L33 12" fill="none" stroke="#8a6d4b" stroke-width="2"/><rect x="17" y="20" width="6" height="12" fill="#8a6d4b"/></svg>';
  }

  TeaGame3D.prototype._syncDOM = function (force) {
    if (!this._ui) return;
    var u = this._ui;
    var c = this._uiCache;
    var setText = function (el, key, val) {
      if (force || c[key] !== val) { el.textContent = val; c[key] = val; }
    };
    setText(u.level, 'level', this.level ? this.level.name + ' ' + this.level.sub : '');
    setText(u.score, 'score', '分数 ' + this.score);
    // Lucian #372 经验条：关卡滚动数字 + 填充 + 计数
    var xpKey = 'xp' + (this.levelIndex + 1) + ':' + this.cleared + '/' + this.total;
    if (force || c.xp !== xpKey) {
      if (this._lucian && this._lucian.xp) this._lucian.xp.setProgress(this.levelIndex + 1, this.cleared, this.total);
      c.xp = xpKey;
    }
    setText(u.best, 'best', this.best > 0 ? '最好成绩：' + this.best + ' 分' : '');
    if (this.state === 'intro' && this.level) {
      setText(u.introName, 'introName', this.level.name);
      setText(u.introSub, 'introSub', this.level.sub);
      setText(u.introText, 'introText', this.level.intro);
      setText(u.introMeta, 'introMeta', '今天有 ' + this.total + ' 件东西，要收到 ' + this.boxes.length + ' 个格子里');
    }
    if (this.state === 'clear') {
      var starsHtml = '';
      for (var s = 0; s < 3; s++) {
        starsHtml += '<span class="' + (s < this.stars ? '' : 'off') + '">★</span>';
      }
      if (force || c.starsHtml !== starsHtml) { u.stars.innerHTML = starsHtml; c.starsHtml = starsHtml; }
      setText(u.clearScore, 'clearScore', '本关得分 +' + this.levelScore + ' 分');
      setText(u.clearDetail, 'clearDetail',
        '最高连对 x' + this.maxCombo + '\n' +
        (this.wrongCount === 0 ? '一次都没放错' : '放错 ' + this.wrongCount + ' 次') + '\n' +
        '总分 ' + this.score + ' 分');
      var last = this.levelIndex + 1 >= this.Levels.LEVELS.length;
      setText(u.clearNext, 'clearNext', last ? '查看成绩' : '第二天');
    }
    if (this.state === 'victory') {
      setText(u.victoryScore, 'victoryScore',
        '总分 ' + this.score + ' 分\n' +
        (this.score >= this.best && this.score > 0 ? '新纪录！' : '最好成绩 ' + this.best + ' 分'));
    }
    // 格子：悬停高亮、晃动、剩余件数
    for (var i = 0; i < this.boxes.length; i++) {
      var b = this.boxes[i];
      if (!b.el) continue;
      var hot = this.hoverBox === b;
      if (force || c['hot' + i] !== hot) {
        b.el.classList.toggle('hot', hot);
        c['hot' + i] = hot;
      }
      if (b.shake > 0 && !b.el.classList.contains('shake')) {
        b.el.classList.add('shake');
        (function (el) { setTimeout(function () { el.classList.remove('shake'); }, 320); })(b.el);
      }
      var left = 0;
      for (var k = 0; k < this.items.length; k++) {
        var it = this.items[k];
        if (it.type.cat === b.cat.key && it.state !== 'flying') left++;
      }
      var countEl = b.el.querySelector('.t3d-bin-count');
      var label = left > 0 ? '还剩 ' + left + ' 件' : '收好了 ✓';
      if (countEl && (force || c['cnt' + i] !== label)) {
        countEl.textContent = label;
        c['cnt' + i] = label;
      }
    }
    // Lucian #242 chip 胶囊：跟随拖拽悬停的格子
    var hoverKey = this.hoverBox ? this.hoverBox.cat.key : '';
    if (force || c.hoverKey !== hoverKey) {
      if (this._lucian && this._lucian.chips) {
        this._lucian.chips.mark(this.hoverBox && this.hoverBox.el ? this.hoverBox.el.querySelector('.u242-ch') : null);
      }
      c.hoverKey = hoverKey;
    }
    // 结算面板显隐
    var show = function (el, on) {
      var key = 'ov' + el.className;
      if (force || c[key] !== on) { el.classList.toggle('show', on); c[key] = on; }
    };
    show(u.ovTitle, this.state === 'title');
    show(u.ovIntro, this.state === 'intro');
    show(u.ovClear, this.state === 'clear');
    show(u.ovVictory, this.state === 'victory');
  };

  // ---------- 调试钩子（测试 / 截图用） ----------
  TeaGame3D.prototype.debugJump = function (screen, levelIdx) {
    if (screen === 'title') {
      this.loadLevel(0);
      this.state = 'title';
      this._syncDOM(true);
      return;
    }
    this.loadLevel(typeof levelIdx === 'number' ? levelIdx : 0);
    if (screen === 'intro') { this.state = 'intro'; this._syncDOM(true); return; }
    if (screen === 'playing') { this.state = 'playing'; this._syncDOM(true); return; }
    if (screen === 'clear') {
      this.debugSortAll();
      return;
    }
    if (screen === 'victory') {
      this.state = 'victory';
      this.score = this.score || 1000;
      this._syncDOM(true);
      return;
    }
    this.state = screen;
    this._syncDOM(true);
  };

  TeaGame3D.prototype.debugSortAll = function () {
    this.state = 'playing';
    while (this._spawnQueue && this._spawnQueue.length > 0) this._spawnNext();
    var items = this.items.slice();
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var box = null;
      for (var b = 0; b < this.boxes.length; b++) {
        if (this.boxes[b].cat.key === it.type.cat) { box = this.boxes[b]; break; }
      }
      if (!box) continue;
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      var gained = 100 + (this.combo - 1) * 20;
      this.score += gained;
      this.levelScore += gained;
      this.cleared++;
      if (it.body && this.world) { try { this.world.removeBody(it.body); } catch (e) {} }
      if (it.mesh && this.scene) this.scene.remove(it.mesh);
    }
    this.items = [];
    this._finishLevel();
  };

  TeaGame3D.prototype.debugItemPos = function (i) {
    var it = this.items[i];
    if (!it) return null;
    var p = this._toScreen(it.x, it.y + 0.4, it.z);
    return { x: p.x, y: p.y, name: it.type.name, cat: it.type.cat, state: it.state };
  };

  //  pile 顶上最显眼的那件（真实拖拽测试用）
  TeaGame3D.prototype.debugTopItem = function () {
    var best = null, bestY = -Infinity;
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      if (it.state !== 'table' && it.state !== 'falling') continue;
      if (it.y > bestY) { bestY = it.y; best = it; }
    }
    if (!best) return null;
    var p = this._toScreen(best.x, best.y, best.z);
    return { x: p.x, y: p.y, name: best.type.name, cat: best.type.cat, state: best.state };
  };

  TeaGame3D.prototype.debugBoxFor = function (cat) {
    for (var i = 0; i < this.boxes.length; i++) {
      if (this.boxes[i].cat.key === cat) return this.boxes[i];
    }
    return null;
  };

  TeaGame3D.prototype._toScreen = function (x, y, z) {
    try {
      if (!this.camera || !this.T) throw new Error('no camera');
      var v = new this.T.Vector3(x, y, z).project(this.camera);
      return { x: (v.x + 1) / 2 * this.view.cssW, y: (-v.y + 1) / 2 * this.view.cssH };
    } catch (e) {
      return { x: this.view.cssW / 2, y: 300 };
    }
  };

  // 物理快进（测试用）：同步跑 N 步 1/60 秒
  TeaGame3D.prototype.debugSettle = function (steps) {
    if (!this.world) return;
    for (var i = 0; i < steps; i++) {
      // v3：逐件倒桶（与 update 相同的落稳门控）
      if (this._spawnQueue && this._spawnQueue.length > 0) {
        this._spawnTimer -= 1 / 60;
        this._spawnWait += 1 / 60;
        var last = this._lastSpawned;
        var settled = !last || !last.body || last.body.velocity.norm() < 1.0;
        if (this._spawnTimer <= 0 && (settled || this._spawnWait > 1.5)) {
          this._spawnTimer = 0.25;
          this._spawnWait = 0;
          this._spawnNext();
        }
      }
      try { this.world.step(1 / 60); } catch (e) {}
      for (var k = 0; k < this.items.length; k++) {
        var it = this.items[k];
        if (it.body && it.mesh) {
          it.mesh.position.copy(it.body.position);
          it.mesh.quaternion.copy(it.body.quaternion);
          it.x = it.body.position.x; it.y = it.body.position.y; it.z = it.body.position.z;
        }
      }
    }
  };

  // 物理状态快照（测试用）：位置、状态、速度、是否穿透、是否在桶内
  TeaGame3D.prototype.debugPhysics = function () {
    var out = { items: [], minGap: Infinity, maxRadius: 0, maxY: 0 };
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      var sp = 0;
      if (it.body && it.body.velocity && it.body.velocity.norm) sp = it.body.velocity.norm();
      var r = Math.sqrt(it.x * it.x + it.z * it.z);
      out.items.push({
        key: it.type.key, cat: it.type.cat, state: it.state,
        x: +it.x.toFixed(3), y: +it.y.toFixed(3), z: +it.z.toFixed(3),
        speed: +sp.toFixed(3), radius: +r.toFixed(3)
      });
      if (r > out.maxRadius) out.maxRadius = r;
      if (it.y > out.maxY) out.maxY = it.y;
    }
    for (var a = 0; a < this.items.length; a++) {
      for (var b = a + 1; b < this.items.length; b++) {
        var ia = this.items[a], ib = this.items[b];
        var dx = ia.x - ib.x, dy = ia.y - ib.y, dz = ia.z - ib.z;
        var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d < out.minGap) out.minGap = d;
      }
    }
    return out;
  };
